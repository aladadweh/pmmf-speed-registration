    --parchment:#f6f3ec; --sand:#c9a06a; --yellow:#f2c300; --ink:#1a1d21;
    --muted:#8a8f96; --line:rgba(255,255,255,0.12); --radius:4px;
    --font:"Segoe UI", Tahoma, "Geeza Pro", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-image:linear-gradient(rgba(246,243,236,0.85), rgba(246,243,236,0.85)), var(--bg-photo);
    background-size:cover; background-position:top center; background-repeat:no-repeat; background-attachment:fixed;
    background-color:var(--parchment); color:var(--ink); font-family:var(--font); direction:rtl; -webkit-font-smoothing:antialiased;
  }
  @media (max-width:768px){ body{ background-attachment:scroll; } }
  a{color:inherit;} button{font-family:inherit;cursor:pointer;} input,select,textarea{font-family:inherit;}

  .checker{
    height:10px;
    background-image:linear-gradient(45deg, var(--ink) 25%, transparent 25%, transparent 75%, var(--ink) 75%),
      linear-gradient(45deg, var(--ink) 25%, transparent 25%, transparent 75%, var(--ink) 75%);
    background-size:14px 14px; background-position:0 0, 7px 7px; background-color:var(--parchment);
  }

  .hero{
    position:relative; min-height:480px;
    background-image:linear-gradient(180deg, rgba(6,8,10,0.22) 0%, rgba(6,8,10,0.32) 55%, rgba(6,8,10,0.48) 100%), var(--bg-photo-hero);
    background-size:cover, cover; background-position:center, center 78%; color:var(--parchment); padding:28px 20px 34px; overflow:hidden;
  }
  .hero-top{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .brandmark{height:34px; object-fit:contain;}
  .fiamark{height:44px; object-fit:contain; opacity:0.95;}
  .member-tag{font-size:10px; letter-spacing:.08em; color:var(--muted); text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;}
  .hero-body{margin-top:48px; max-width:640px;}
  .eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.12em; color:var(--yellow);
    border:1px solid rgba(242,195,0,0.5); padding:4px 10px; border-radius:2px; background:rgba(242,195,0,0.08);}
  .hero-title{font-size:clamp(26px,5vw,40px); line-height:1.25; font-weight:800; margin:16px 0 6px;}
  .hero-sub{font-size:clamp(15px,2.6vw,19px); color:var(--sand); font-weight:700; margin:0 0 18px;}
  .hero-meta{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .meta-pill{background:rgba(255,255,255,0.08); border:1px solid var(--line); padding:8px 14px; border-radius:2px; font-size:13px; display:flex; gap:8px; align-items:baseline;}
  .meta-pill b{font-size:16px; color:var(--yellow);}
  .meta-pill.warn{border-color:var(--red); background:rgba(206,17,38,0.12);}
  .meta-pill.warn b{color:var(--red);}

  .countdown{margin-top:12px; background:rgba(255,255,255,0.08); border:1px solid var(--line); border-radius:2px;
    padding:10px 16px; display:inline-flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .countdown.urgent{border-color:var(--red); background:rgba(206,17,38,0.12);}
  .countdown-label{font-size:12px; font-weight:700; color:var(--sand); white-space:nowrap;}
  .countdown-digits{display:flex; align-items:flex-start; gap:6px;}
  .cd-box{display:flex; flex-direction:column; align-items:center; min-width:34px;}
  .cd-num{font-family:'Courier New',monospace; font-size:22px; font-weight:800; color:var(--yellow); line-height:1; letter-spacing:1px;}
  .countdown.urgent .cd-num{color:var(--red);}
  .cd-unit{font-size:9px; color:var(--muted); margin-top:3px;}
  .cd-sep{font-size:18px; font-weight:800; color:var(--yellow); opacity:.55; margin-top:1px;}
  .countdown.urgent .cd-sep{color:var(--red);}
  @media (max-width:560px){ .cd-num{font-size:18px;} .cd-box{min-width:28px;} .countdown{gap:10px; padding:8px 12px;} }

  .shell{max-width:720px; margin:0 auto; padding:0 18px 80px;}

  .steps{display:flex; justify-content:space-between; margin:-1px auto 0; max-width:720px; background:var(--ink);}
  .step{flex:1; text-align:center; padding:12px 4px; font-size:12px; color:rgba(255,255,255,0.4);
    border-left:1px solid rgba(255,255,255,0.08); position:relative; transition:color .2s;}
  .step:last-child{border-left:none;}
  .step b{display:block; font-size:15px; font-weight:800; color:rgba(255,255,255,0.3); transition:color .2s;}
  .step.active{color:var(--parchment);} .step.active b{color:var(--yellow);}
  .step.done{color:rgba(255,255,255,0.75);} .step.done b{color:var(--green);}
  .step-bar{height:3px; background:var(--asphalt-2);}
  .step-bar-fill{height:100%; background:var(--yellow); width:33%; transition:width .3s;}

  .card{background:#fff; border:1px solid #e4dfd3; border-radius:var(--radius); margin-top:22px; overflow:hidden;}
  .card-head{display:flex; align-items:center; gap:12px; padding:16px 18px; background:var(--ink); color:var(--parchment);}
  .card-num{width:30px; height:30px; border-radius:50%; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none;}
  .card-head h3{margin:0; font-size:16px; font-weight:700;}
  .card-head span{font-size:12px; color:var(--muted); display:block; margin-top:2px;}
  .card-body{padding:20px 18px 22px;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){.grid{grid-template-columns:1fr;}}

  .field{margin-bottom:14px;}
  .field.full{grid-column:1/-1;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:6px; color:var(--ink);}
  .field label .req{color:var(--red); margin-right:3px;}
  .field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=number],
  .field input[type=date], .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid #d8d2c2; border-radius:2px; font-size:14px; background:#fdfcf9; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--green); outline-offset:1px; border-color:var(--green);}
  .hint{font-size:11.5px; color:var(--muted); margin-top:4px;}
  .err{font-size:12px; color:var(--red); margin-top:4px; display:none;}
  .field.invalid input, .field.invalid select{border-color:var(--red);}
  .field.invalid .err{display:block;}

  .check-row{display:flex; align-items:flex-start; gap:10px; background:#fbf8f1; border:1px solid #e4dfd3; border-radius:2px; padding:12px 14px; margin-bottom:12px;}
  .check-row input{margin-top:3px;}
  .check-row label{font-size:13px; line-height:1.6;}
  .check-row.invalid{border-color:var(--red); background:#fdf2f2;}

  .terms-box{margin-top:26px; border:1px solid #e4dfd3; border-radius:2px; overflow:hidden;}
  .terms-box h4{margin:0; background:var(--ink); color:#fff; padding:10px 14px; font-size:13.5px;}
  .terms-box ul{margin:0; padding:0; list-style:none;}
  .terms-box li{padding:9px 14px; border-top:1px solid #e4dfd3; font-size:13px; line-height:1.7; color:var(--ink); background:#fff;}
  .terms-box li:first-child{border-top:none;}

  .doc-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:560px){.doc-grid{grid-template-columns:1fr;}}
  .doc-card{border:1.5px dashed #cfc7b1; border-radius:2px; padding:14px; text-align:center; position:relative; background:#fdfcf9; transition:border-color .15s;}
  .doc-card.filled{border-style:solid; border-color:var(--green); background:#f3f9f4;}
  .doc-card.invalid{border-color:var(--red);}
  .doc-card .doc-label{font-size:13px; font-weight:700; margin-bottom:8px;}
  .doc-card .doc-sub{font-size:11px; color:var(--muted); margin-bottom:10px;}
  .doc-card input[type=file]{display:none;}
  .doc-btn{display:inline-block; border:1px solid var(--ink); background:var(--ink); color:#fff; font-size:12.5px; padding:7px 14px; border-radius:2px;}
  .doc-card.filled .doc-btn{background:var(--green); border-color:var(--green);}
  .doc-preview{margin-top:10px; max-width:100%; max-height:110px; border-radius:2px; display:none;}
  .doc-file-name{font-size:11px; color:var(--green); margin-top:6px; word-break:break-all; display:none;}
  .doc-remove{position:absolute; top:8px; left:8px; background:var(--red); color:#fff; border:none; width:20px; height:20px; border-radius:50%; font-size:12px; line-height:1; display:none;}

  .nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px;}
  .btn-next, .btn-submit{background:var(--red); color:#fff; border:none; font-size:15px; font-weight:800; padding:14px 32px; border-radius:2px; letter-spacing:.02em; box-shadow:0 6px 0 rgba(0,0,0,0.15); transition:transform .1s;}
  .btn-next:active, .btn-submit:active{transform:translateY(4px); box-shadow:none;}
  .btn-submit:disabled, .btn-next:disabled{background:#b8b2a4; box-shadow:none; cursor:not-allowed;}
  .btn-back{background:transparent; border:1px solid var(--ink); color:var(--ink); font-size:14px; font-weight:700; padding:13px 26px; border-radius:2px;}
  .submit-note{font-size:12px; color:var(--muted); margin-top:10px; text-align:center;}
  .form-msg{max-width:420px; margin:14px auto 0; font-size:13px; color:var(--red); text-align:center; display:none;}

  .closed-banner{max-width:720px; margin:0 auto; padding:60px 20px; text-align:center;}
  .closed-banner .flag{font-size:46px; margin-bottom:14px;}
  .closed-banner h2{font-size:22px; margin:0 0 10px;}
  .closed-banner p{color:var(--muted); font-size:14px; max-width:420px; margin:0 auto;}

  .success-wrap{max-width:520px; margin:0 auto; padding:60px 20px; text-align:center;}
  .success-badge{width:76px; height:76px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:36px; margin:0 auto 18px;}
  .race-number{display:inline-block; background:var(--ink); color:var(--yellow); font-size:30px; font-weight:800; padding:10px 26px; border-radius:2px; margin:14px 0; letter-spacing:.05em;}
  .btn-secondary{display:inline-block; margin-top:16px; border:1px solid var(--ink); background:transparent; color:var(--ink); padding:10px 22px; border-radius:2px; font-size:13px; font-weight:700;}

  footer{text-align:center; padding:26px 16px 40px; font-size:11.5px; color:var(--muted);}
  .admin-gear{background:none; border:none; color:var(--muted); font-size:11px; text-decoration:underline; margin-top:8px;}

  .overlay{position:fixed; inset:0; background:rgba(11,14,17,0.82); display:none; align-items:center; justify-content:center; padding:16px; z-index:50;}
  .overlay.open{display:flex;}
  .overlay-box{background:#fff; border-radius:4px; max-width:1400px; width:96vw; max-height:88vh; overflow:auto; padding:20px;}
  .overlay-box h3{margin-top:0;}
  .admin-table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px;}
  .admin-table th, .admin-table td{border:1px solid #e4dfd3; padding:6px 8px; text-align:right;}
  .admin-table th{background:#f6f3ec;}
  .admin-del-btn{background:var(--red); color:#fff; border:none; padding:5px 10px; border-radius:2px; font-size:11.5px; cursor:pointer;}
  .admin-del-btn:disabled{opacity:0.5; cursor:default;}
  .admin-close{float:left; border:none; background:none; font-size:20px; cursor:pointer;}
  .admin-login input{width:100%; padding:10px; margin:10px 0; border:1px solid #d8d2c2;}
  .admin-actions{display:flex; gap:10px; margin:14px 0; flex-wrap:wrap;}
  .admin-actions button{border:1px solid var(--ink); background:var(--ink); color:#fff; padding:8px 14px; border-radius:2px; font-size:12px;}
  .admin-actions button.danger{background:var(--red); border-color:var(--red);}
  .admin-actions button.ghost{background:transparent; color:var(--ink);}
  .loading-note{text-align:center; padding:60px 20px; color:var(--muted);}

  .setup-banner{max-width:640px; margin:40px auto; padding:22px 24px; background:#fdf2d8; border:1px solid var(--yellow); border-radius:4px; font-size:13.5px; line-height:1.9;}
  .setup-banner code{background:#fff; padding:2px 6px; border-radius:2px; border:1px solid #e4dfd3; direction:ltr; display:inline-block;}

  /* ---------------- Responsive ---------------- */
  @media (max-width:768px){
    .hero{padding:20px 16px 26px;}
    .hero-body{margin-top:34px;}
    .shell{padding:0 14px 60px;}
    .card-body{padding:16px 14px 18px;}
    .overlay-box{padding:16px; max-height:92vh;}
  }
  @media (max-width:640px){
    .hero-meta{gap:8px;}
    .meta-pill{padding:6px 10px; font-size:12px;}
    .step{font-size:11px; padding:10px 3px;}
    .nav-row{flex-wrap:wrap;}
    .btn-back, .btn-next, .btn-submit{flex:1 1 auto; text-align:center; padding:13px 18px;}
    .admin-table{font-size:11.5px;}
    .admin-table th, .admin-table td{padding:5px 6px;}
  }
  @media (max-width:420px){
    .brandmark{height:28px;}
    .fiamark{height:36px;}
    .member-tag{font-size:9px;}
    .hero-title{margin:12px 0 4px;}
    .card-head{padding:14px 14px;}
    .card-head h3{font-size:15px;}
    .step b{display:block;}
    .step{font-size:10px;}
    .doc-card{padding:10px;}
  }
</style>
</head>

function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(action, extra){
  const res = await fetch(CONFIG.API_URL, { method:'POST', body: JSON.stringify(Object.assign({action}, extra||{})) });
  return res.json();
}

// ---------------- rendering shells ----------------
function countdownWidget(targetIso, mode, label){
  return `
  <div class="countdown" id="countdownWidget" data-target="${esc(targetIso)}" data-mode="${mode}">
    <div class="countdown-label">${esc(label)}</div>
    <div class="countdown-digits" dir="ltr">
      <div class="cd-box"><span class="cd-num" id="cdDays">00</span><span class="cd-unit">يوم</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-box"><span class="cd-num" id="cdHours">00</span><span class="cd-unit">ساعة</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-box"><span class="cd-num" id="cdMins">00</span><span class="cd-unit">دقيقة</span></div>
      <div class="cd-sep">:</div>
      <div class="cd-box"><span class="cd-num" id="cdSecs">00</span><span class="cd-unit">ثانية</span></div>
    </div>
  </div>`;
}

function heroBlock(){
  const s = state.status || {count:0, cap:70, daysLeft:3, closed:false, notYetOpen:false};
  const remaining = Math.max(0, s.cap - s.count);
  let countdownHtml = '';
  if(s.notYetOpen && s.opensAt){
    countdownHtml = countdownWidget(s.opensAt, 'open', 'العد التنازلي لفتح التسجيل');
  }else if(!s.closed && s.closesAt){
    countdownHtml = countdownWidget(s.closesAt, 'close', 'العد التنازلي لإغلاق التسجيل');
  }
  return `
  <div class="hero">
    <div class="hero-top">
      <img class="brandmark" src="${ASSETS.pmmf}" alt="PMMF">
      <div class="member-tag"><span>MEMBER OF</span><img class="fiamark" src="${ASSETS.fia}" alt="FIA"></div>
    </div>
    <div class="hero-body">
      <span class="eyebrow">الجولة الثانية &nbsp;•&nbsp; 2026</span>
      <div class="hero-title">طلب اشتراك في<br>سباق السرعة</div>
      <div class="hero-sub">الاتحاد الفلسطيني لرياضة السيارات والدراجات النارية</div>
      <div class="hero-meta">
        <div class="meta-pill ${remaining<=10?'warn':''}">المقاعد المتبقية <b>${remaining}</b> / ${s.cap}</div>
      </div>
      ${countdownHtml}
    </div>
  </div>
  <div class="checker"></div>`;
}

}

async function boot(){
  if(!CONFIG.API_URL){
    app.innerHTML = heroBlock() + setupBanner() + footerBlock();
    wireFooter();
    return;
  }
  try{
    state.status = await api('status');
  }catch(err){
    app.innerHTML = heroBlock() + `<div class="setup-banner">تعذّر الاتصال بقاعدة البيانات. تأكد أن رابط Apps Script صحيح وأن النشر تم بصلاحية "Anyone".</div>` + footerBlock();
    wireFooter();
    return;
  }
  if(state.status.closed){ app.innerHTML = closedScreen(); wireFooter(); return; }
  app.innerHTML = wizardScreen();
  wireWizard();
  wireFooter();
  goStep(1);
}

let countdownTimer = null;
function wireCountdown(){
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  const el = document.getElementById('countdownWidget');
  if(!el) return;
  const target = new Date(el.dataset.target).getTime();
  if(isNaN(target)) return;
  const setDigit = (id, v) => { const e = document.getElementById(id); if(e) e.textContent = String(v).padStart(2,'0'); };
  const tick = ()=>{
    const diff = target - Date.now();
    if(diff <= 0){
      clearInterval(countdownTimer);
      countdownTimer = null;
      boot();
      return;
    }
    setDigit('cdDays', Math.floor(diff / 86400000));
    setDigit('cdHours', Math.floor((diff % 86400000) / 3600000));
    setDigit('cdMins', Math.floor((diff % 3600000) / 60000));
    setDigit('cdSecs', Math.floor((diff % 60000) / 1000));
    el.classList.toggle('urgent', diff <= 60*60*1000);
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function wireFooter(){
  const b = document.getElementById('openAdmin');
  if(b) b.addEventListener('click', openAdminGate);
  wireCountdown();
}

function goStep(n){
  state.step = n;
  state.maxStep = Math.max(state.maxStep, n);
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (Number(c.dataset.step) === n) ? '' : 'none';
  });
  const bar = document.querySelector('.step-bar-fill');
  if(bar) bar.style.width = (n/4*100)+'%';
  document.querySelectorAll('.step').forEach((el,i)=>{
    el.classList.remove('active','done');
    if(i+1===n) el.classList.add('active');
    else if(i+1<n) el.classList.add('done');
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

function fieldError(id, show){
  const el = document.getElementById('f_'+id);
  if(el) el.classList.toggle('invalid', show);
}
function val(id){ return document.getElementById(id).value.trim(); }

function formatDate(isoStr){
  const d = new Date(isoStr);
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
}

function calcAge(dobStr){
  if(!dobStr) return NaN;
  const dob = new Date(dobStr);
  if(isNaN(dob.getTime())) return NaN;
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
  return age;
}

function validateStep1(){
  let ok = true;
  const req = ['nationalId','dob','phone','city','bloodType','emergencyName','emergencyPhone'];
  req.forEach(k=>{ const bad = !val(k); fieldError(k, bad); if(bad) ok=false; });
  const nameParts = val('fullName').split(/\s+/).filter(Boolean);
  const nameBad = nameParts.length < 3 || nameParts.length > 4;
  fieldError('fullName', nameBad);
  if(nameBad) ok=false;
  const email = val('email');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ fieldError('email', true); ok=false; }
  const phone = val('phone');
  if(phone && phone.replace(/\D/g,'').length < 8){ fieldError('phone', true); ok=false; }
  return ok;
}
function validateStep2(){
  let ok = true;
  const req = ['assistantNationalId','assistantDob','assistantPhone','assistantCity'];
  req.forEach(k=>{ const bad = !val(k); fieldError(k, bad); if(bad) ok=false; });
  const assistantNameParts = val('assistantFullName').split(/\s+/).filter(Boolean);
  const assistantNameBad = assistantNameParts.length < 3 || assistantNameParts.length > 4;
  fieldError('assistantFullName', assistantNameBad);
  if(assistantNameBad) ok=false;
  const assistantAge = calcAge(val('assistantDob'));
  const assistantAgeBad = isNaN(assistantAge) || assistantAge < 20;
  fieldError('assistantDob', assistantAgeBad);
  if(assistantAgeBad) ok=false;
  return ok;
}
function validateStep3(){
  let ok = true;
  ['carMake','carModel','carYear','carPlate','drivetrain'].forEach(k=>{ const bad=!val(k); fieldError(k,bad); if(bad) ok=false; });
  const engineCapacityBad = !/^\d+(\.\d+)?\s*(cc|t)$/i.test(val('engineCapacity'));
  fieldError('engineCapacity', engineCapacityBad);
  if(engineCapacityBad) ok=false;
  return ok;
}
function validateStep4(){
  let ok = true;
  DOCS.forEach(doc=>{
    const card = document.getElementById('doccard_'+doc.key);
    const missing = !state.files[doc.key];
    card.classList.toggle('invalid', missing);
    if(missing) ok=false;
  });
  const waiver = document.getElementById('waiver').checked;
  const terms = document.getElementById('terms').checked;
  document.getElementById('row_waiver').classList.toggle('invalid', !waiver);
  document.getElementById('row_terms').classList.toggle('invalid', !terms);
  if(!waiver || !terms) ok=false;
  return ok;
}

function compressImage(file){
  return new Promise((resolve, reject)=>{
    if(!file.type.startsWith('image/')){
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
      return;
    }
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e)=>{
      img.onload = ()=>{
        const maxW = 1100;
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  document.getElementById('toStep2').addEventListener('click', ()=>{ if(validateStep1()) goStep(2); else scrollToFirstInvalid(); });
  document.getElementById('toStep1').addEventListener('click', ()=> goStep(1));
  document.getElementById('toStep3').addEventListener('click', ()=>{ if(validateStep2()) goStep(3); else scrollToFirstInvalid(); });
  document.getElementById('toStep2b').addEventListener('click', ()=> goStep(2));
  document.getElementById('toStep4').addEventListener('click', ()=>{ if(validateStep3()) goStep(4); else scrollToFirstInvalid(); });
  document.getElementById('toStep3b').addEventListener('click', ()=> goStep(3));

  DOCS.forEach(doc=>{
    const input = document.getElementById('docinput_'+doc.key);
    const card = document.getElementById('doccard_'+doc.key);
    const preview = document.getElementById('docpreview_'+doc.key);
    const nameEl = document.getElementById('docname_'+doc.key);
    const removeBtn = document.getElementById('docremove_'+doc.key);

    input.addEventListener('change', async ()=>{
      const file = input.files[0];
      if(!file) return;
      if(file.size > 4*1024*1024){ alert('حجم الملف كبير جدًا (الحد الأقصى 4 ميغابايت): '+doc.label); input.value=''; return; }
      const dataUrl = await compressImage(file);
      state.files[doc.key] = {name:file.name, dataUrl};
      card.classList.add('filled'); card.classList.remove('invalid');
      nameEl.textContent = file.name; nameEl.style.display='block';
      removeBtn.style.display='block';
      if(dataUrl.startsWith('data:image')){ preview.src=dataUrl; preview.style.display='block'; }
      else preview.style.display='none';
    });
    removeBtn.addEventListener('click', ()=>{
      delete state.files[doc.key]; input.value='';
      card.classList.remove('filled'); preview.style.display='none';
      nameEl.style.display='none'; removeBtn.style.display='none';
    });
  });

  document.getElementById('submitBtn').addEventListener('click', onSubmit);
}

// ---------------- توليد نسخة الـPDF داخل المتصفح ----------------
// القالب أدناه منقول حرفيًا من التصميم المرجعي المعتمد (pmmf-registration-form.html) مع
// تحويل ألوان oklch/color-mix إلى HEX مكافئة، لأن html2canvas لا يدعم دوال الألوان الحديثة.
// letter-spacing محذوفة عمدًا: html2canvas يرسم الحروف واحدًا واحدًا عند ضبطها فيكسر تشكيل العربية.
const PDF_COLORS = {
  black:'#0d0a0b', red:'#c9000c', green:'#00602a', ink:'#171b1f',
  paper:'#fbfaf7', line:'#d5d8db', muted:'#51565b',
  tintBlack:'#efefee', tintRed:'#f9eeec', tintGreen:'#eef3ee'
};

// شريط العلم المتقطّع (رقعة الشطرنج) يُرسم على canvas حقيقي ويُضمَّن كصورة، لأن دعم html2canvas
// لخلفيات الـgradient المتعددة المتراكبة (تقنية المرجع الأصلية) غير موثوق.
function checkerDataUrl(w, h, sq){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.fillStyle = PDF_COLORS.black;
  for(let y = 0; y < h / sq; y++){
    for(let x = 0; x < w / sq; x++){
      if((x + y) % 2 === 0) g.fillRect(x * sq, y * sq, sq, sq);
    }
  }
  return c.toDataURL('image/png');
}

// تذييل صفحة موحّد (نفس الألوان والتخطيط والهوامش أينما استُخدم) - عنصر مستقل بأنماط inline

// يُستخدم في نموذج التسجيل الفردي (pdfDocumentHtml) وفي تصدير كشف المتسابقين (exportAdminPdf)
// معًا، ثم يُصيَّر لاحقًا كصورة منفصلة وتُعاد لصقها على هامش كل صفحة عبر
// renderPdfWithRepeatingFooter - بدل تركه في نهاية المحتوى المتدفّق فيظهر فقط أسفل آخر صفحة
// عند تعدد الصفحات. الصنف "pdf-footer" مطلوب حرفيًا (محدِّد الاستعلام في renderPdfWithRepeatingFooter).
function pdfFooterHtml(){

// يُصيّر عنصر el إلى PDF مع معاملة عنصر التذييل (محدَّدًا بـfooterSelector) كصورة منفصلة تتكرر
// على هامش كل صفحة - بدل تركه مرة واحدة في نهاية المحتوى المتدفّق (فيظهر عندها فقط أسفل آخر
// صفحة عند تعدد الصفحات، وأحيانًا في غير موضعه إن كانت الصفحة الأخيرة قصيرة المحتوى). يعيد
// كائن jsPDF الناتج (استخدم .output()/.save() عليه مباشرة)، أو null إن كان التصيير الأولي صفحة
// بيضاء فارغة. نسبة px→mm تُحسَب داخليًا من عرض el الفعلي المُقاس (getBoundingClientRect) مقابل
// عرض محتوى الصفحة المتاح بعد الهوامش الجانبية - فتبقى صحيحة بصرف النظر عن أي حشو (padding)
// داخلي في el نفسه أو في عنصر التذييل.
async function renderPdfWithRepeatingFooter(el, footerSelector, opts){
  const pageWidthMm = opts.jsPDF.orientation === 'landscape' ? 297 : 210; // A4 فقط (الحالة الوحيدة المستخدَمة هنا)
  const baseMargin = opts.margin || 0;
  const m = Array.isArray(baseMargin) ? baseMargin.slice() : [baseMargin, baseMargin, baseMargin, baseMargin]; // [top, right, bottom, left]
  const pxToMm = (pageWidthMm - m[1] - m[3]) / el.getBoundingClientRect().width;

  const footerEl = el.querySelector(footerSelector);
  const elRect = el.getBoundingClientRect();
  const footerRect = footerEl.getBoundingClientRect();
  const footerOffsetXPx = footerRect.left - elRect.left;
  const footerGapPx = parseFloat(getComputedStyle(footerEl).marginTop) || 0;
  const footerHeightMm = (footerRect.height + footerGapPx) * pxToMm;

  const footerCanvas = await html2pdf().set({ html2canvas: opts.html2canvas }).from(footerEl).toCanvas().get('canvas');
  const footerImg = footerCanvas.toDataURL('image/jpeg', 0.92);
  footerEl.remove();

  m[2] = m[2] + footerHeightMm;
  const finalOpts = Object.assign({}, opts, { margin: m });

  const canvas = await html2pdf().set(finalOpts).from(el).toCanvas().get('canvas');
  if(!canvasHasContent(canvas)) return null;

  const pdf = await html2pdf().set(finalOpts).from(el).toPdf().get('pdf');
  const pageHeight = pdf.internal.pageSize.getHeight();
  const pageCount = pdf.internal.getNumberOfPages();
  const footerXmm = m[3] + footerOffsetXPx * pxToMm;
  const footerWidthMm = footerRect.width * pxToMm;
  for(let i = 1; i <= pageCount; i++){
    pdf.setPage(i);
    pdf.addImage(footerImg, 'JPEG', footerXmm, pageHeight - m[2], footerWidthMm, footerHeightMm);
  }
  return pdf;
}

// يفحص أن الكانفس المُصيَّر ليس صفحة بيضاء فارغة: يعاين عيّنة صفوف بكسلات موزعة؛ إن كانت
// كلها بيضاء نعتبر التصيير فاشلًا فنعيد null ليتولى الباك إند التوليد الخادمي بدل إرسال PDF فارغ.
function canvasHasContent(canvas){
  try{
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    if(!w || !h) return false;
    const rows = [0.05, 0.2, 0.4, 0.6, 0.8].map(f => Math.floor(h * f));
    for(const y of rows){
      const px = ctx.getImageData(0, y, w, 1).data;
      for(let i = 0; i < px.length; i += 40){
        if(px[i] < 245 || px[i+1] < 245 || px[i+2] < 245) return true;
      }
    }
    return false;
  }catch(e){ return true; } // تعذّر الفحص نفسه - لا نعطّل الإرسال بسببه
}

// يُصيّر القالب في عنصر مخفي خارج الشاشة ويحوّله إلى PDF (A4 عمودي) ويعيده data URL،
// أو null عند أي فشل (المكتبة غير محمّلة، خطأ تصيير، ناتج فارغ...) - عندها يتولى الباك إند
// التوليد الخادمي.
async function generateRegistrationPdf(entry, regNumber){
  if(typeof html2pdf === 'undefined') return null;
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-9999px;top:0;width:794px;background:#ffffff;';
  host.innerHTML = pdfDocumentHtml(entry, regNumber);
  document.body.appendChild(host);
  // html2canvas يُزيح اللقطة بمقدار تمرير الصفحة الحالي، وهو ما أنتج PDF فارغًا عند الإرسال
  // من أسفل صفحة التسجيل الطويلة - نصفّر التمرير مؤقتًا ونثبّت scrollX/scrollY في الخيارات.
  const scroll = { x: window.scrollX || 0, y: window.scrollY || 0 };
  window.scrollTo(0, 0);
  try{
    if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
    // انتظار اكتمال فك ترميز الشعارات المضمّنة قبل التصيير
    await Promise.all(Array.from(host.querySelectorAll('img')).map(img =>
      (img.decode ? img.decode() : Promise.resolve()).catch(()=>{})
    ));
    const el = host.firstElementChild;
    const opts = {
      margin: 0,
      image: { type: 'jpeg', quality: 0.92 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false, scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] }
    };
    const pdf = await renderPdfWithRepeatingFooter(el, '.pdf-footer', opts);

  }catch(err){

async function onSubmit(){
  if(state.submitting) return;
  if(!validateStep4()){ scrollToFirstInvalid(); return; }

  const msg = document.getElementById('formMsg');
  msg.style.display='none';

  const entry = {
    fullName: val('fullName'), nationalId: val('nationalId'), dob: val('dob'), phone: val('phone'),
    email: val('email'), city: val('city'), category: val('category'), experience: val('experience'),
    bloodType: val('bloodType'), emergencyName: val('emergencyName'), emergencyPhone: val('emergencyPhone'),
    assistant:{
      fullName: val('assistantFullName'), nationalId: val('assistantNationalId'),
      dob: val('assistantDob'), age: calcAge(val('assistantDob')),
      phone: val('assistantPhone'), city: val('assistantCity')
    },
    car:{
      carMake: val('carMake'), carModel: val('carModel'), engineCapacity: val('engineCapacity'),
      carYear: val('carYear'), carPlate: val('carPlate'), carColor: val('carColor'),
      drivetrain: val('drivetrain'),
      hasSeat: false,
      hasRollCage: false,
      hasFireExt: document.getElementById('hasFireExt').checked,
      hasHarness: document.getElementById('hasHarness').checked,
      hasTowPoints: document.getElementById('hasTowPoints').checked
    },
    files: state.files
  };

  state.submitting = true;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'جارٍ تجهيز النموذج...';

  // توليد نسخة الـPDF في المتصفح برقم تسجيل متوقع (= العدد الحالي + 1 بعد تحديث الحالة).
  // الباك إند يقبلها فقط إن طابق الرقم المتوقع الرقم الفعلي عنده، وإلا يعيد التوليد خادميًا -
  // فالسباق النادر بين تسجيلين متزامنين لا يُنتج أبدًا رقمًا خاطئًا داخل النموذج المرسَل.
  let predictedReg = null, pdfDataUrl = null;
  try{
    state.status = await api('status');
    predictedReg = (Number(state.status.count) || 0) + 1;
    pdfDataUrl = await generateRegistrationPdf(entry, predictedReg);
  }catch(err){ pdfDataUrl = null; }
  if(pdfDataUrl){
    entry.pdfFile = pdfDataUrl;
    entry.pdfRegNumber = predictedReg;
  }

  btn.textContent = 'جارٍ الإرسال...';
  let result;
  try{
    result = await api('register', {payload: entry});
  }catch(err){
    result = {error:'network'};
  }

  if(result.error){
    state.submitting = false; btn.disabled = false; btn.textContent = 'إرسال طلب الاشتراك 🏁';
    const map = {
      duplicate: 'اسمك أو رقم هويتك مسجّل مسبقًا في النظام (كمتسابق أو كمساعد). لا يمكن تكرار تسجيل نفس الشخص أكثر من مرة.',
      duplicate_assistant: 'اسم المساعد أو رقم هويته مسجّل مسبقًا في النظام (كمتسابق أو كمساعد). لا يمكن تكرار تسجيل نفس الشخص أكثر من مرة.',
      closed: 'تم إغلاق التسجيل (اكتمل العدد أو انتهت المدة).',
      network: 'تعذّر الاتصال بالخادم. تأكد من اتصالك بالإنترنت وحاول مجددًا.'
    };
    msg.textContent = map[result.error] || 'حدث خطأ غير متوقع، حاول مرة أخرى.';
    msg.style.display='block';
    return;
  }

  // نسخة الـPDF المحلية صالحة للتنزيل فقط إذا طابق رقمها المتوقع الرقم الفعلي من الخادم
  if(pdfDataUrl && predictedReg === result.raceNumber){
    state.generatedPdf = { dataUrl: pdfDataUrl, raceNumber: result.raceNumber };
  } else {
    state.generatedPdf = null;
  }

  await buildAndDownloadZip(entry, result.raceNumber);
  app.innerHTML = successScreen(entry, result.raceNumber);
  wireFooter();
  document.getElementById('downloadAgain')?.addEventListener('click', ()=> buildAndDownloadZip(entry, result.raceNumber));
  document.getElementById('downloadPdf')?.addEventListener('click', ()=> downloadGeneratedPdf(entry));
}

async function buildAndDownloadZip(entry, raceNumber){
  try{
    const zip = new JSZip();
    const folder = zip.folder(entry.fullName + ' - ' + entry.nationalId);
    const info = `الاتحاد الفلسطيني لرياضة السيارات والدراجات النارية
طلب اشتراك - سباق السرعة - الجولة الثانية لعام 2026
------------------------------------------------
رقم التسجيل: #${String(raceNumber).padStart(2,'0')}
الاسم الكامل: ${entry.fullName}
رقم الهوية: ${entry.nationalId}
رقم الجوال: ${entry.phone}
الفئة: ${entry.category}
اسم المساعد: ${entry.assistant.fullName}
هوية المساعد: ${entry.assistant.nationalId}
عمر المساعد: ${entry.assistant.age}
جوال المساعد: ${entry.assistant.phone}
مدينة المساعد: ${entry.assistant.city}
الشركة المصنعة: ${entry.car.carMake}
الطراز (الموديل): ${entry.car.carModel}
سعة المحرك: ${entry.car.engineCapacity || '-'}
رقم اللوحة: ${entry.car.carPlate}
`;
    folder.file('بيانات_المتسابق.txt', info);
    DOCS.forEach(doc=>{
      const f = entry.files[doc.key];
      if(!f) return;
      const isImg = f.dataUrl.startsWith('data:image');
      const ext = isImg ? (f.dataUrl.includes('image/png') ? 'png':'jpg') : (f.name.split('.').pop()||'pdf');
      folder.file(doc.label+'.'+ext, f.dataUrl.split(',')[1], {base64:true});
    });
    const blob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (entry.fullName||'مشترك') + ' - وثائق التسجيل.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(err){ console.error('zip failed', err); }
}

// تصدير Excel حقيقي (.xlsx): صفّا عناوين - صف التصنيف بخلايا مدمجة فوق صف أسماء الأعمدة -
// وورقة باتجاه يمين-لليسار، مع عمود إضافي أخير لرابط مجلد المستندات في Drive.
function exportAdminExcel(entries){
  if(typeof XLSX === 'undefined'){ alert('تعذّر تحميل مكتبة Excel، تأكد من اتصالك بالإنترنت وأعد تحميل الصفحة.'); return; }
  const row1 = [], row2 = [], merges = [];
  let c = 0;
  ADMIN_EXPORT_GROUPS.forEach(g=>{
    row1.push(g.title);
    for(let i = 1; i < g.cols.length; i++) row1.push('');
    if(g.cols.length > 1) merges.push({s:{r:0,c:c}, e:{r:0,c:c+g.cols.length-1}});
    g.cols.forEach(col=> row2.push(col[0]));
    c += g.cols.length;
  });
  row1.push('مجلد المستندات'); row2.push('');
  merges.push({s:{r:0,c:c}, e:{r:1,c:c}});
  const dataRows = entries.map(en=>{
    const r = [];
    ADMIN_EXPORT_GROUPS.forEach(g=>g.cols.forEach(col=>{
      const v = en[col[1]];
      r.push(v === null || v === undefined ? '' : v);
    }));
    r.push(en.folderUrl || '');
    return r;
  });
  const ws = XLSX.utils.aoa_to_sheet([row1, row2].concat(dataRows));
  ws['!merges'] = merges;
  ws['!cols'] = row2.map((h,i)=>({wch: (i===1 || i===5) ? 24 : (i===row2.length-1 ? 40 : 12)}));
  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, 'المتسابقون');
  XLSX.writeFile(wb, 'كشف_المتسابقين.xlsx');
}

// يقصّ صورة (data URL) مركزيًا لتصبح بالضبط بأبعاد targetW×targetH (مربّعة 6×6 هنا) - يُستخدم فقط
// في تصدير Excel لأن ExcelJS يُضمّن الصورة كما هي بلا أي قصّ من عنده، بخلاف الـPDF الذي يعتمد على
// object-fit:cover في CSS مباشرة فلا يحتاج قصًّا فعليًا للبيانات.
function cropImageCover(dataUrl, targetW, targetH){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const srcRatio = img.width / img.height, targetRatio = targetW / targetH;
      let sx, sy, sw, sh;
      if(srcRatio > targetRatio){ sh = img.height; sw = sh * targetRatio; sx = (img.width - sw) / 2; sy = 0; }
      else{ sw = img.width; sh = sw / targetRatio; sx = 0; sy = (img.height - sh) / 2; }
      const canvas = document.createElement('canvas');
      canvas.width = targetW; canvas.height = targetH;
      canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// فعلية عند الكتابة؛ كل صورة تُقصّ مركزيًا إلى مربّع 6×6 عبر cropImageCover قبل تضمينها.
async function exportPhotoRosterExcel(entries, pass){

  const photos = photosRes.photos || {};

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('كشف الصور', { views: [{ rightToLeft: true }] });
  ws.columns = [
    { header: 'رقم التسابق', width: 12 },
    { header: 'الاسم', width: 28 },
    { header: 'المدينة', width: 18 },
    { header: 'Licence Type', width: 16 },
    { header: 'الصورة', width: 12 }
  ];
  const border = { style: 'thin', color: { argb: 'FFD5D8DB' } };
  ws.getRow(1).eachCell(c=>{
    c.font = { bold: true, color: { argb: 'FFFFFFFF' } };
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0D0A0B' } };
    c.alignment = { horizontal: 'center', vertical: 'middle' };
    c.border = { top: border, bottom: border, left: border, right: border };
  });

  for(let i = 0; i < entries.length; i++){
    const en = entries[i];
    const row = ws.addRow([en.raceNumber || '', en.fullName || '', en.city || '', '', '']);
    row.height = 60;
    row.eachCell(c=>{
      c.alignment = { horizontal: 'center', vertical: 'middle' };
      c.border = { top: border, bottom: border, left: border, right: border };
    });
    const src = photos[en.raceNumber];
    if(src){
      const cropped = await cropImageCover(src, 144, 144);
      const imageId = wb.addImage({ base64: cropped, extension: 'jpeg' });
      ws.addImage(imageId, { tl: { col: 4, row: row.number - 1 }, ext: { width: 64, height: 64 } });
    }
  }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'كشف_صور_المتسابقين.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

// توليد نماذج الاشتراك لكل المسجّلين بالتصميم المتصفحي المطابق (نفس قالب pdfDocumentHtml
// حرفيًا، بلا أي تعديل) ورفعها للباك إند ليحفظها في مجلد "الاشتراكات" في Drive مستبدلةً
// الملفات القديمة بنفس الأسماء (#01 - الاسم.pdf ...). يعمل تسلسليًا مع مؤشر تقدم على الزر.
async function regenerateSubscriptionsToDrive(pass, progressBtn){
  const full = await api('exportAll', {pass});
  if(full.error || !full.rows || full.rows.length < 2){
    alert('تعذّر جلب بيانات المسجّلين: ' + (full.error || 'لا توجد تسجيلات'));
    return;
  }
  const dateOnly = v => {
    const s = String(v || '');
    return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : s;
  };
  const asBool = v => String(v).trim() === 'نعم';
  const rows = full.rows.slice(1); // أول صف = العناوين
  const photosRes = await api('photos', {pass});
  const photos = photosRes.photos || {};
  let done = 0, failed = [];
  let folderUrl = '';
  for(const r of rows){
    const raceNumber = r[1];
    const entry = {
      fullName: String(r[2]||''), nationalId: String(r[3]||''), dob: dateOnly(r[4]), phone: String(r[5]||''),
      email: String(r[6]||''), city: String(r[7]||''), category: String(r[8]||''), experience: String(r[9]||''),
      bloodType: String(r[10]||''), emergencyName: String(r[11]||''), emergencyPhone: String(r[12]||''),
      photoDataUrl: photos[raceNumber] || '',
      assistant: {
        fullName: String(r[13]||''), nationalId: String(r[14]||''), dob: dateOnly(r[15]),
        age: String(r[16]||''), phone: String(r[17]||''), city: String(r[18]||'')
      },
      car: {
        carMake: String(r[19]||''), carModel: String(r[20]||''), engineCapacity: String(r[21]||''),
        carYear: String(r[22]||''), carPlate: String(r[23]||''), carColor: String(r[24]||''),
        drivetrain: String(r[25]||''),
        hasSeat: asBool(r[26]), hasRollCage: asBool(r[27]), hasFireExt: asBool(r[28]),
        hasHarness: asBool(r[29]), hasTowPoints: asBool(r[30])
      }
    };
    progressBtn.textContent = 'توليد ورفع ' + (done + 1) + '/' + rows.length + '...';
    try{
      const pdf = await generateRegistrationPdf(entry, raceNumber);
      if(!pdf) throw new Error('فشل التصيير في المتصفح');
      const fileName = '#' + String(raceNumber).padStart(2, '0') + ' - ' + entry.fullName + '.pdf';
      const saved = await api('storeSubscriptionPdf', {pass, fileName, pdfFile: pdf});
      if(saved.error) throw new Error(saved.error);
      folderUrl = saved.folderUrl || folderUrl;
      done++;
    }catch(err){
      failed.push('#' + raceNumber + ' ' + entry.fullName + ' (' + err.message + ')');
    }
  }
  let msg = 'اكتمل: تم توليد ورفع ' + done + ' من ' + rows.length + ' نموذجًا إلى مجلد "الاشتراكات" في Drive.';
  if(failed.length) msg += '\n\nفشل:\n' + failed.join('\n') + '\n\nأعد المحاولة - الناجحة سابقًا ستُستبدل بلا تكرار.';
  if(folderUrl) msg += '\n\nرابط المجلد:\n' + folderUrl;
  alert(msg);
}

function renderAdminPanel(res, pass){
  const content = document.getElementById('adminContent');
  const s = res.status;
  const isClosed = s.closed && s.count < s.cap && s.daysLeft > 0 && !s.notYetOpen; // مغلق يدويًا
  content.innerHTML = `
    <h3>لوحة تحكم الاتحاد</h3>
    <p>عدد المسجلين: <b>${s.count}</b> / ${s.cap} — أيام متبقية: <b>${s.daysLeft}</b>${s.notYetOpen ? ' — لم يبدأ التسجيل بعد (يبدأ بتاريخ ' + formatDate(s.opensAt) + ')' : ''}</p>
    <div class="admin-actions">
      <button id="toggleCloseBtn" class="${isClosed?'ghost':'danger'}">${isClosed?'إعادة فتح التسجيل':'إغلاق التسجيل الآن'}</button>
      <button id="extendBtn" class="ghost">تمديد التسجيل (إعادة تشغيل العد التنازلي)</button>
      <button id="exportAllBtn" class="ghost">تصدير كشف كامل بجميع المتسابقين (CSV)</button>
      <button id="exportExcelBtn">تصدير الجدول Excel</button>
      <button id="exportPdfBtn">تصدير الجدول PDF</button>
      <button id="exportPhotoRosterBtn" class="ghost">تصدير كشف الصور PDF</button>
      <button id="exportPhotoRosterExcelBtn" class="ghost">تصدير كشف الصور Excel</button>
      <button id="regenSubsBtn">توليد نماذج الاشتراكات بالتصميم ورفعها إلى Drive</button>
    </div>
    <div style="overflow:auto;">
    <table class="admin-table">
      <tr>
        <th colspan="5">بيانات المتسابق</th>
        <th colspan="3">بيانات المساعد</th>
        <th colspan="12">بيانات السيارة</th>
        <th rowspan="2">مجلد المستندات</th>
        <th rowspan="2">حذف</th>
      </tr>
      <tr>
        <th>#</th><th>الاسم</th><th>رقم الهوية</th><th>المدينة</th><th>فصيلة الدم</th>
        <th>الاسم</th><th>رقم الهوية</th><th>العمر</th>
        <th>الشركة المصنعة</th><th>الطراز</th><th>سعة المحرك</th><th>سنة الصنع</th><th>رقم اللوحة</th><th>اللون</th><th>نظام الدفع</th><th>مقعد</th><th>قفص حماية</th><th>طفاية حريق</th><th>حزام أمان</th><th>نقاط السحب</th>
      </tr>
      ${res.entries.map(en=>`
        <tr>
          <td>${en.raceNumber}</td><td>${esc(en.fullName)}</td><td>${esc(en.nationalId)}</td><td>${esc(en.city)}</td><td>${esc(en.bloodType)}</td>
          <td>${esc(en.assistantFullName)}</td><td>${esc(en.assistantNationalId)}</td><td>${esc(en.assistantAge)}</td>
          <td>${esc(en.carMake)}</td><td>${esc(en.carModel)}</td><td>${esc(en.engineCapacity)}</td><td>${esc(en.carYear)}</td><td>${esc(en.carPlate)}</td><td>${esc(en.carColor)}</td><td>${esc(en.drivetrain)}</td><td>${esc(en.hasSeat)}</td><td>${esc(en.hasRollCage)}</td><td>${esc(en.hasFireExt)}</td><td>${esc(en.hasHarness)}</td><td>${esc(en.hasTowPoints)}</td>
          <td><a href="${en.folderUrl}" target="_blank">فتح في Drive</a></td>
          <td><button class="admin-del-btn" data-id="${esc(en.nationalId)}">حذف</button></td>
        </tr>`).join('')}
    </table></div>`;

  document.getElementById('toggleCloseBtn').addEventListener('click', async ()=>{
    await api('toggleClose', {pass});
    document.getElementById('adminOverlay').classList.remove('open');
    boot();
  });

  document.getElementById('extendBtn').addEventListener('click', async ()=>{
    if(!confirm('سيتم إعادة تشغيل عدّاد الأيام من جديد بدءًا من الآن، وإلغاء أي إغلاق يدوي. متابعة؟')) return;
    await api('extend', {pass});
    document.getElementById('adminOverlay').classList.remove('open');
    boot();
  });

  document.getElementById('exportExcelBtn').addEventListener('click', ()=> exportAdminExcel(res.entries));

  document.getElementById('regenSubsBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('regenSubsBtn');
    if(!confirm('سيتم توليد نموذج PDF بالتصميم المعتمد لكل مشترك (' + res.entries.length + ' مشتركًا) ورفعها إلى مجلد "الاشتراكات" في Drive مع استبدال الملفات القديمة.\nقد يستغرق ذلك بضع دقائق - أبقِ هذه الصفحة مفتوحة. متابعة؟')) return;
    btn.disabled = true;
    try{ await regenerateSubscriptionsToDrive(pass, btn); }
    finally{ btn.disabled = false; btn.textContent = 'توليد نماذج الاشتراكات بالتصميم ورفعها إلى Drive'; }
  });

  document.getElementById('exportPdfBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('exportPdfBtn');
    btn.disabled = true; btn.textContent = 'جارٍ توليد PDF...';
    try{ await exportAdminPdf(res.entries, s); }
    finally{ btn.disabled = false; btn.textContent = 'تصدير الجدول PDF'; }
  });

  document.getElementById('exportPhotoRosterBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('exportPhotoRosterBtn');
    btn.disabled = true; btn.textContent = 'جارٍ توليد PDF...';
    try{ await exportPhotoRosterPdf(res.entries, pass); }
    finally{ btn.disabled = false; btn.textContent = 'تصدير كشف الصور PDF'; }
  });

  document.getElementById('exportPhotoRosterExcelBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('exportPhotoRosterExcelBtn');
    btn.disabled = true; btn.textContent = 'جارٍ توليد Excel...';
    try{ await exportPhotoRosterExcel(res.entries, pass); }
    finally{ btn.disabled = false; btn.textContent = 'تصدير كشف الصور Excel'; }
  });

  document.getElementById('exportAllBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('exportAllBtn');
    btn.disabled = true; btn.textContent = 'جارٍ التصدير...';
    const full = await api('exportAll', {pass});
    btn.disabled = false; btn.textContent = 'تصدير كشف كامل بجميع المتسابقين (CSV)';
    if(full.error || !full.rows){ alert('تعذّر التصدير: ' + (full.error||'')); return; }
    const csvRows = full.rows.map(row => row.map(cell => {
      const v = (cell===null||cell===undefined) ? '' : String(cell);
      return '"' + v.replace(/"/g,'""') + '"';
    }).join(','));
    const csv = '﻿' + csvRows.join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'كشف_المتسابقين.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  });

  content.querySelectorAll('.admin-del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('هل أنت متأكد من حذف هذا المتسابق؟ سيتحرر رقمه من العدد الكلي.')) return;
      btn.disabled = true;
      const delRes = await api('delete', {pass, nationalId: btn.dataset.id});
      if(delRes.error){ alert('تعذّر الحذف: ' + delRes.error); btn.disabled = false; return; }
      const fresh = await api('admin', {pass});
      renderAdminPanel(fresh, pass);
    });
  });
}

document.getElementById('adminCloseBtn').addEventListener('click', ()=>{
  document.getElementById('adminOverlay').classList.remove('open');
});

boot();

})();
</script>
